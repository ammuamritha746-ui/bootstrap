<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">

</head>
<body>
    <div class="container">
        <div id="demo" class="carousel slide" data-ride="carousel">
            <ul class="carousel-indicators">
              
          <li data-target="#demo" data-slide-to="0" class="active"></li>
          
          <li data-target="#demo" data-slide-to="1" class="active"></li>
          <li data-target="#demo" data-slide-to="2" class="active"></li>
            </ul>
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRQSujSPrAkTmeam-MrAedSwZeDQuWZyX-He0bE7Ye04A&s=10"  width="1100" height="500">
                 <div class="carousel-caption">
                    <h1 class="text-white">Thailand</h1>
                 </div>   
                </div>
                <div class="carousel-item">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQn2Tec050qxi7iRCSUeVN-c3JNuoBbGJHDPG3keL9WxQ&s=10" width="1100" height="500">
                    <div class="carousel-caption">
                        <h1 class="text-white">Singapore</h1>
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRU2-T62EEcyTc8cPNNJR-GIfR8t6c3qsXYlhnawNWCtg&s=10"  width="1100" height="500">
                    <div class="carousel-caption">
                        <h1 class="text-white">Goa</h1>
                    </div>
                </div>
            </div>
            <a class="carousel-control-prev" href="#demo" data-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </a>
            <a class="carousel-control-next" href="#demo" data-slide="prev">
                <span class="carousel-control-next-icon"></span>
            </a>
        </div>
        <br>
        <button type="button" class="btn btn-primary mx-auto d-block" data-toggle="modal" data-target="#myModal">BookNow</button>
        <div class="modal" id="myModal">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Travel package</h5>
                        <button class="btn-close" data-dismiss="modal">&times;</button>
                    </div>
                    <div class="modal-body">
                        <p>5 DAYS  and 4 NIGHTS</p>
                        <P>HOTEL + FOOD + SIGHTSEEING INCLUDED</P>
                        <P>starting price: 25,000</P>
                    </div>
                    <div class="modal-footer"><button class="btn btn-secondary" data-dismiss="modal">close</button>
                    <button class="btn btn-success">Confirm Booking</button></div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</body>
</html>
